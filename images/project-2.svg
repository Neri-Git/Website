<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="hwG1" cx="78%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#b86bff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#0c0c0c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hwG2" cx="22%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#ff8c38" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0c0c0c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hwGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <pattern id="pixelGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#b86bff" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" rx="16" fill="#0f0f14"/>
  <rect width="800" height="450" rx="16" fill="url(#hwGrid)"/>
  <rect width="800" height="450" rx="16" fill="url(#hwG1)"/>
  <rect width="800" height="450" rx="16" fill="url(#hwG2)"/>
  <rect x="1" y="1" width="798" height="448" rx="15" fill="none" stroke="#b86bff" stroke-opacity="0.28" stroke-width="2"/>

  <!-- Main Window -->
  <rect x="55" y="45" width="690" height="360" rx="12" fill="#0b0b0f" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
  <circle cx="82" cy="70" r="6" fill="#ff8c38"/>
  <circle cx="102" cy="70" r="6" fill="#b86bff"/>
  <circle cx="122" cy="70" r="6" fill="#3a3a48"/>
  <text x="400" y="75" fill="#9ca3af" font-family="monospace" font-size="13" text-anchor="middle">Python — Hand-Drawn Number &amp; Letter Recognition</text>
  <line x1="55" y1="92" x2="745" y2="92" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- Left: 28x28 Drawing Matrix Canvas -->
  <rect x="85" y="118" width="230" height="230" rx="12" fill="#13131c" stroke="#ff8c38" stroke-opacity="0.6" stroke-width="1.8"/>
  <rect x="85" y="118" width="230" height="230" rx="12" fill="url(#pixelGrid)"/>
  <!-- Hand-drawn glowing stroke "5" / "A" -->
  <path d="M 235 155 L 165 155 L 158 215 C 185 205, 240 212, 238 255 C 236 292, 185 305, 152 288" fill="none" stroke="#ff8c38" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  <path d="M 235 155 L 165 155 L 158 215 C 185 205, 240 212, 238 255 C 236 292, 185 305, 152 288" fill="none" stroke="#ffd8b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="200" y="372" fill="#9ca3af" font-family="monospace" font-size="12" text-anchor="middle">Input Canvas (Digits &amp; A-Z)</text>

  <!-- Center Arrow / Neural Net Nodes -->
  <circle cx="360" cy="180" r="9" fill="#161622" stroke="#b86bff" stroke-width="2"/>
  <circle cx="360" cy="233" r="9" fill="#161622" stroke="#ff8c38" stroke-width="2"/>
  <circle cx="360" cy="286" r="9" fill="#161622" stroke="#b86bff" stroke-width="2"/>
  <line x1="315" y1="210" x2="351" y2="180" stroke="#b86bff" stroke-opacity="0.5" stroke-width="1.5"/>
  <line x1="315" y1="233" x2="351" y2="233" stroke="#ff8c38" stroke-opacity="0.6" stroke-width="1.5"/>
  <line x1="315" y1="256" x2="351" y2="286" stroke="#b86bff" stroke-opacity="0.5" stroke-width="1.5"/>
  <line x1="369" y1="180" x2="405" y2="215" stroke="#b86bff" stroke-opacity="0.5" stroke-width="1.5"/>
  <line x1="369" y1="233" x2="405" y2="233" stroke="#ff8c38" stroke-opacity="0.6" stroke-width="1.5"/>
  <line x1="369" y1="286" x2="405" y2="250" stroke="#b86bff" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- Right: Classification Output & Confidence -->
  <rect x="405" y="118" width="310" height="230" rx="12" fill="#12121a" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="430" y="150" fill="#b86bff" font-family="monospace" font-size="13" font-weight="bold">PREDICTION RESULT</text>

  <!-- Confidence Bar 1 -->
  <text x="430" y="185" fill="#e1e1e1" font-family="monospace" font-size="14" font-weight="bold">'5'</text>
  <rect x="468" y="172" width="185" height="16" rx="4" fill="#1e1e2a"/>
  <rect x="468" y="172" width="174" height="16" rx="4" fill="#ff8c38"/>
  <text x="695" y="185" fill="#ff8c38" font-family="monospace" font-size="12" text-anchor="end">96.4%</text>

  <!-- Confidence Bar 2 -->
  <text x="430" y="220" fill="#9ca3af" font-family="monospace" font-size="14">'S'</text>
  <rect x="468" y="207" width="185" height="16" rx="4" fill="#1e1e2a"/>
  <rect x="468" y="207" width="24" height="16" rx="4" fill="#b86bff"/>
  <text x="695" y="220" fill="#9ca3af" font-family="monospace" font-size="12" text-anchor="end">2.8%</text>

  <!-- Confidence Bar 3 -->
  <text x="430" y="255" fill="#9ca3af" font-family="monospace" font-size="14">'6'</text>
  <rect x="468" y="242" width="185" height="16" rx="4" fill="#1e1e2a"/>
  <rect x="468" y="242" width="8" height="16" rx="4" fill="#b86bff" fill-opacity="0.6"/>
  <text x="695" y="255" fill="#9ca3af" font-family="monospace" font-size="12" text-anchor="end">0.8%</text>

  <!-- Tech Stack Pills -->
  <rect x="430" y="295" width="78" height="28" rx="6" fill="#ff8c38" fill-opacity="0.15"/>
  <text x="469" y="313" fill="#ff8c38" font-family="monospace" font-size="12" text-anchor="middle">Python</text>

  <rect x="520" y="295" width="84" height="28" rx="6" fill="#b86bff" fill-opacity="0.15"/>
  <text x="562" y="313" fill="#b86bff" font-family="monospace" font-size="12" text-anchor="middle">AI / ML</text>

  <rect x="616" y="295" width="78" height="28" rx="6" fill="#ff8c38" fill-opacity="0.15"/>
  <text x="655" y="313" fill="#ff8c38" font-family="monospace" font-size="12" text-anchor="middle">Vision</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="crmG1" cx="20%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#ff8c38" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0c0c0c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="crmG2" cx="85%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#b86bff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#0c0c0c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="crmGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" rx="16" fill="#0f0f14"/>
  <rect width="800" height="450" rx="16" fill="url(#crmGrid)"/>
  <rect width="800" height="450" rx="16" fill="url(#crmG1)"/>
  <rect width="800" height="450" rx="16" fill="url(#crmG2)"/>
  <rect x="1" y="1" width="798" height="448" rx="15" fill="none" stroke="#ff8c38" stroke-opacity="0.28" stroke-width="2"/>

  <!-- Main IDE / API Console Window -->
  <rect x="55" y="45" width="690" height="360" rx="12" fill="#0b0b0f" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
  <circle cx="82" cy="70" r="6" fill="#ff8c38"/>
  <circle cx="102" cy="70" r="6" fill="#b86bff"/>
  <circle cx="122" cy="70" r="6" fill="#3a3a48"/>
  <text x="400" y="75" fill="#9ca3af" font-family="monospace" font-size="13" text-anchor="middle">ASP.NET Core Web API — Clean Architecture CRM</text>
  <line x1="55" y1="92" x2="745" y2="92" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- Left Column: Clean Architecture Layers -->
  <rect x="82" y="116" width="215" height="62" rx="8" fill="#161622" stroke="#ff8c38" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="190" y="142" fill="#ff8c38" font-family="monospace" font-weight="bold" font-size="14" text-anchor="middle">WebAPI Layer</text>
  <text x="190" y="162" fill="#c9c9c9" font-family="monospace" font-size="11" text-anchor="middle">REST Controllers &amp; Auth</text>

  <line x1="190" y1="178" x2="190" y2="198" stroke="#b86bff" stroke-width="2" stroke-dasharray="4 3"/>

  <rect x="82" y="198" width="215" height="62" rx="8" fill="#161622" stroke="#b86bff" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="190" y="224" fill="#b86bff" font-family="monospace" font-weight="bold" font-size="14" text-anchor="middle">AppCore Domain</text>
  <text x="190" y="244" fill="#c9c9c9" font-family="monospace" font-size="11" text-anchor="middle">Entities, DTOs &amp; Validators</text>

  <line x1="190" y1="260" x2="190" y2="280" stroke="#ff8c38" stroke-width="2" stroke-dasharray="4 3"/>

  <rect x="82" y="280" width="215" height="62" rx="8" fill="#161622" stroke="#ff8c38" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="190" y="306" fill="#ff8c38" font-family="monospace" font-weight="bold" font-size="14" text-anchor="middle">Infrastructure</text>
  <text x="190" y="326" fill="#c9c9c9" font-family="monospace" font-size="11" text-anchor="middle">EF Core • SQLite • Identity JWT</text>

  <!-- Right Column: REST Endpoints & Badges -->
  <rect x="330" y="116" width="388" height="226" rx="10" fill="#12121a" stroke="#ffffff" stroke-opacity="0.07"/>

  <!-- Endpoint 1 -->
  <rect x="348" y="134" width="54" height="22" rx="4" fill="#ff8c38" fill-opacity="0.2" stroke="#ff8c38"/>
  <text x="375" y="149" fill="#ff8c38" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">POST</text>
  <text x="415" y="149" fill="#e1e1e1" font-family="monospace" font-size="13">/api/auth/login</text>
  <text x="698" y="149" fill="#b86bff" font-family="monospace" font-size="11" text-anchor="end">JWT + Refresh</text>

  <!-- Endpoint 2 -->
  <rect x="348" y="172" width="54" height="22" rx="4" fill="#b86bff" fill-opacity="0.2" stroke="#b86bff"/>
  <text x="375" y="187" fill="#b86bff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">GET</text>
  <text x="415" y="187" fill="#e1e1e1" font-family="monospace" font-size="13">/api/people &amp; /companies</text>
  <text x="698" y="187" fill="#9ca3af" font-family="monospace" font-size="11" text-anchor="end">200 OK</text>

  <!-- Endpoint 3 -->
  <rect x="348" y="210" width="54" height="22" rx="4" fill="#ff8c38" fill-opacity="0.2" stroke="#ff8c38"/>
  <text x="375" y="225" fill="#ff8c38" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">POST</text>
  <text x="415" y="225" fill="#e1e1e1" font-family="monospace" font-size="13">/api/contact-import</text>
  <text x="698" y="225" fill="#b86bff" font-family="monospace" font-size="11" text-anchor="end">CSV / JSON</text>

  <!-- Endpoint 4 -->
  <rect x="348" y="248" width="54" height="22" rx="4" fill="#b86bff" fill-opacity="0.2" stroke="#b86bff"/>
  <text x="375" y="263" fill="#b86bff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">POST</text>
  <text x="415" y="263" fill="#e1e1e1" font-family="monospace" font-size="13">/api/people/{id}/notes</text>
  <text x="698" y="263" fill="#9ca3af" font-family="monospace" font-size="11" text-anchor="end">RBAC</text>

  <!-- Tech Stack Pills -->
  <rect x="348" y="294" width="70" height="26" rx="6" fill="#ff8c38" fill-opacity="0.14"/>
  <text x="383" y="311" fill="#ff8c38" font-family="monospace" font-size="12" text-anchor="middle">C# .NET</text>

  <rect x="428" y="294" width="76" height="26" rx="6" fill="#b86bff" fill-opacity="0.14"/>
  <text x="466" y="311" fill="#b86bff" font-family="monospace" font-size="12" text-anchor="middle">EF Core</text>

  <rect x="514" y="294" width="72" height="26" rx="6" fill="#ff8c38" fill-opacity="0.14"/>
  <text x="550" y="311" fill="#ff8c38" font-family="monospace" font-size="12" text-anchor="middle">SQLite</text>

  <rect x="596" y="294" width="102" height="26" rx="6" fill="#b86bff" fill-opacity="0.14"/>
  <text x="647" y="311" fill="#b86bff" font-family="monospace" font-size="12" text-anchor="middle">xUnit Tests</text>
</svg>
